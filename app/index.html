<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>UyReel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0A1222);--fg:var(--tg-theme-text-color,#fff);--mut:var(--tg-theme-hint-color,#9aa7bd);
--card:var(--tg-theme-secondary-bg-color,#131d33);--acc:var(--tg-theme-button-color,#2ee6a6);--accfg:var(--tg-theme-button-text-color,#04130d)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%}
#top{display:flex;gap:8px;padding:8px}
#q{flex:1;min-width:0;border:0;border-radius:12px;padding:11px 12px;font-size:16px;background:var(--card);color:var(--fg);outline:none}
#top button{border:0;border-radius:12px;padding:0 14px;font-size:18px;background:var(--card);color:var(--fg)}
#map{flex:1;min-height:0;position:relative;background:#111}
#hint{position:absolute;z-index:500;left:8px;right:8px;top:8px;padding:8px 10px;border-radius:10px;background:rgba(10,18,34,.82);color:#fff;font-size:13px;text-align:center;pointer-events:none}
#layers{position:absolute;z-index:500;right:8px;bottom:8px;display:flex;border-radius:10px;overflow:hidden}
#layers button{border:0;padding:8px 10px;font-size:13px;background:rgba(10,18,34,.82);color:#fff}
#layers button.on{background:#fff;color:#0A1222;font-weight:600}
#sheet{padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:6px;align-items:center}
.row .lab{width:64px;flex:none;color:var(--mut);font-size:12.5px}
.seg{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:1.5px solid transparent;border-radius:10px;padding:9px 10px;font-size:14px;background:var(--card);color:var(--fg);white-space:nowrap}
.seg button.on{border-color:var(--acc);font-weight:600}
.seg button:disabled{opacity:.4}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
#area{color:var(--mut);font-size:12.5px;min-height:16px;text-align:center}
#done{display:none;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;background:var(--acc);color:var(--accfg)}
#done:disabled{opacity:.45}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:#ff3b30;border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.cor{width:22px;height:22px;border-radius:50%;background:#ffd60a;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.6);color:#000;font:700 11px/16px sans-serif;text-align:center}
#msg{display:none;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><input id="q" type="search" enterkeyhint="search" autocomplete="off"><button id="me" aria-label="my location">◎</button></div>
  <div id="map"><div id="hint"></div><div id="layers"><button data-l="sat" class="on"></button><button data-l="str"></button></div></div>
  <div id="sheet">
    <div class="row"><span class="lab" id="l_mode"></span><div class="seg" id="mode"><button data-v="pin" class="on"></button><button data-v="cor"></button><button data-v="undo" id="undo" disabled></button></div></div>
    <div id="area"></div>
    <div class="row"><span class="lab" id="l_look"></span><div class="seg" id="look"></div></div>
    <div class="row"><span class="lab" id="l_len"></span><div class="seg" id="len"><button data-v="0" class="on"></button><button data-v="20">20 с</button><button data-v="30">30 с</button><button data-v="45">45 с</button></div></div>
    <button id="done"></button>
  </div>
</div>
<div id="msg"></div>
<script>
(function(){
var tg=window.Telegram&&Telegram.WebApp, P={};
(location.hash||'').replace(/^#/,'').split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)P[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
var L=(P.l||(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||'ru').slice(0,2); if(['ru','ky','en'].indexOf(L)<0)L='ru';
var T={ru:{q:'Адрес или место',pin:'📍 Точка',cor:'📐 Углы',undo:'↩︎',mode:'На карте',look:'Стиль',len:'Длина',auto:'Авто',sat:'Спутник',str:'Схема',done:'Готово',
 h_pin:'Нажмите на карту — поставьте точку на объекте',h_cor:'Нажимайте на углы участка по кругу. Первые два — вдоль дороги',need:'Сначала поставьте точку на объекте',
 area:'Участок ≈ ',sot:' сот.',ha:' га',more:'Нужно минимум 3 угла',nf:'Не нашёл это место',out:'Откройте эту страницу кнопкой «Карта» в боте UyReel.',big:'Слишком много углов (максимум 30)'},
 ky:{q:'Дарек же жер',pin:'📍 Чекит',cor:'📐 Бурчтар',undo:'↩︎',mode:'Картада',look:'Стиль',len:'Узундугу',auto:'Авто',sat:'Спутник',str:'Схема',done:'Даяр',
 h_pin:'Картаны басып, объектке чекит коюңуз',h_cor:'Участоктун бурчтарын тегерете басыңыз. Алгачкы экөө — жолдун боюнда',need:'Адегенде объектке чекит коюңуз',
 area:'Участок ≈ ',sot:' сот.',ha:' га',more:'Жок дегенде 3 бурч керек',nf:'Бул жер табылган жок',out:'Бул баракты UyReel ботундагы «Карта» баскычы менен ачыңыз.',big:'Бурчтар өтө көп (эң көбү 30)'},
 en:{q:'Address or place',pin:'📍 Pin',cor:'📐 Corners',undo:'↩︎',mode:'On the map',look:'Style',len:'Length',auto:'Auto',sat:'Satellite',str:'Streets',done:'Done',
 h_pin:'Tap the map to put the pin on the property',h_cor:'Tap the corners of the plot, going round. First two along the road',need:'Put the pin on the property first',
 area:'Plot ≈ ',sot:' sotka',ha:' ha',more:'At least 3 corners are needed',nf:'Could not find that place',out:'Open this page with the Map button in the UyReel bot.',big:'Too many corners (30 at most)'}}[L];
var LOOKS={land:[['survey_yellow','#ffd60a',{ru:'Жёлтый',ky:'Сары',en:'Yellow'}],['golden_hour','#ff9f43',{ru:'Закат',ky:'Күн батыш',en:'Sunset'}],['neon_cyan','#22d3ee',{ru:'Неон',ky:'Неон',en:'Neon'}]],
 house:[['champagne','#e8d3a8',{ru:'Светлый',ky:'Ачык',en:'Light'}],['cinematic','#c2410c',{ru:'Кино',ky:'Кино',en:'Cinema'}],['minimal','#e5e7eb',{ru:'Минимал',ky:'Минимал',en:'Minimal'}]],
 apartment:[['ice_modern','#93c5fd',{ru:'Лёд',ky:'Муз',en:'Ice'}],['midnight','#312e81',{ru:'Ночь',ky:'Түн',en:'Night'}],['mono_clean','#9ca3af',{ru:'Моно',ky:'Моно',en:'Mono'}]]};
var kind=LOOKS[P.k]?P.k:'land';
function $(i){return document.getElementById(i)}
function sel(box,v){[].forEach.call(box.children,function(b){b.classList.toggle('on',b.dataset.v===v)})}
$('q').placeholder=T.q;$('l_mode').textContent=T.mode;$('l_look').textContent=T.look;$('l_len').textContent=T.len;
var mb=$('mode').children;mb[0].textContent=T.pin;mb[1].textContent=T.cor;mb[2].textContent=T.undo;
$('len').children[0].textContent=T.auto;var lb=$('layers').children;lb[0].textContent=T.sat;lb[1].textContent=T.str;$('done').textContent=T.done;
if(P.fixed==='1'){$('look').parentNode.style.display='none'}      // a partner demo bot has one fixed look
var look='';(function(){var h='<button data-v="" class="on">'+T.auto+'</button>';LOOKS[kind].forEach(function(x){h+='<button data-v="'+x[0]+'"><span class="sw" style="background:'+x[1]+'"></span>'+x[2][L]+'</button>'});$('look').innerHTML=h})();
$('look').onclick=function(e){var b=e.target.closest('button');if(!b)return;look=b.dataset.v;sel($('look'),look)};
var sec=0;$('len').onclick=function(e){var b=e.target.closest('button');if(!b)return;sec=+b.dataset.v;sel($('len'),b.dataset.v)};

var lat=parseFloat(P.lat),lon=parseFloat(P.lon),has=isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180;
var map=L_map();
function L_map(){var m=window.L.map('map',{zoomControl:false,attributionControl:true,tap:true}).setView(has?[lat,lon]:[42.8746,74.5698],has?18:12);return m}
var Lf=window.L;
var sat=Lf.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19,attribution:'Esri, Maxar'}).addTo(map);
var str=Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,attribution:'© OpenStreetMap'});
$('layers').onclick=function(e){var b=e.target.closest('button');if(!b)return;var s=b.dataset.l==='sat';map.removeLayer(s?str:sat);map.addLayer(s?sat:str);lb[0].classList.toggle('on',s);lb[1].classList.toggle('on',!s)};
var pin=null,corners=[],poly=Lf.polygon([],{color:'#ffd60a',weight:3,fillOpacity:.15}).addTo(map),mode='pin';
function icon(c,t){return Lf.divIcon({className:'',html:'<div class="'+c+'">'+(t||'')+'</div>',iconSize:[26,26],iconAnchor:c==='pin'?[13,26]:[11,11]})}
function setPin(ll){if(pin)pin.setLatLng(ll);else{pin=Lf.marker(ll,{icon:icon('pin'),draggable:true}).addTo(map)}refresh()}
function area(){if(corners.length<3)return 0;var ps=corners.map(function(m){return m.getLatLng()}),la=0,lo=0;ps.forEach(function(p){la+=p.lat;lo+=p.lng});la/=ps.length;lo/=ps.length;
 var k=Math.cos(la*Math.PI/180),xy=ps.map(function(p){return[(p.lng-lo)*111320*k,(p.lat-la)*110540]}),s=0;for(var i=0;i<xy.length;i++){var j=(i+1)%xy.length;s+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1]}return Math.abs(s)/2}
function refresh(){poly.setLatLngs(corners.map(function(m){return m.getLatLng()}));
 var a=area();$('area').textContent=corners.length&&corners.length<3?T.more:a?T.area+(a>=10000?(a/10000).toFixed(2)+T.ha:(a/100).toFixed(1)+T.sot):'';
 $('undo').disabled=!corners.length;$('hint').textContent=mode==='pin'?T.h_pin:T.h_cor;
 var ok=!!pin||corners.length>=3;$('done').disabled=!ok;if(tg&&tg.MainButton){tg.MainButton.setText(T.done);ok?tg.MainButton.show():tg.MainButton.hide()}}
if(has)setPin([lat,lon]);
function addCorner(ll){var m=Lf.marker(ll,{icon:icon('cor',corners.length+1),draggable:true}).addTo(map);m.on('drag',refresh);corners.push(m)}
if(P.c){P.c.split(';').slice(0,30).forEach(function(t){var v=t.split(',');var a=parseFloat(v[0]),b=parseFloat(v[1]);if(isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180)addCorner([a,b])});
 if(corners.length>=3){mode='cor';mb[0].classList.remove('on');mb[1].classList.add('on');
  setTimeout(function(){map.fitBounds(Lf.latLngBounds(corners.map(function(m){return m.getLatLng()})).pad(0.25),{maxZoom:19})},350)}}
map.on('click',function(e){if(mode==='pin'){setPin(e.latlng);return}
 if(corners.length>=30){$('area').textContent=T.big;return}
 addCorner(e.latlng);
 if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');refresh()});
$('mode').onclick=function(e){var b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.v==='undo'){var m=corners.pop();if(m)map.removeLayer(m);refresh();return}
 mode=b.dataset.v;mb[0].classList.toggle('on',mode==='pin');mb[1].classList.toggle('on',mode==='cor');
 if(mode==='cor'&&pin&&map.getZoom()<18)map.setView(pin.getLatLng(),18);refresh()};
$('me').onclick=function(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(function(p){map.setView([p.coords.latitude,p.coords.longitude],18)},function(){}, {enableHighAccuracy:true,timeout:10000})};
$('q').addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();var v=this.value.trim();if(!v)return;this.blur();
 var m=v.match(/(-?\d{1,2}\.\d{3,})[,\s]+(-?\d{1,3}\.\d{3,})/);if(m){map.setView([+m[1],+m[2]],18);return}
 var c=map.getCenter();fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language='+L+'&viewbox='+(c.lng-1.5)+','+(c.lat+1)+','+(c.lng+1.5)+','+(c.lat-1)+'&q='+encodeURIComponent(v))
 .then(function(r){return r.json()}).then(function(d){if(d&&d[0])map.setView([+d[0].lat,+d[0].lon],17);else $('area').textContent=T.nf}).catch(function(){$('area').textContent=T.nf})});
function r6(x){return Math.round(x*1e6)/1e6}
function send(){var c=corners.map(function(m){var p=m.getLatLng();return[r6(p.lat),r6(p.lng)]});if(c.length&&c.length<3)c=[];
 if(!pin&&!c.length){$('area').textContent=T.need;return}
 var out={v:1};if(pin){var p=pin.getLatLng();out.pin=[r6(p.lat),r6(p.lng)]}if(c.length)out.c=c;if(look)out.look=look;if(sec)out.sec=sec;
 tg.sendData(JSON.stringify(out))}
if(tg&&tg.initData!==undefined&&tg.platform&&tg.platform!=='unknown'){tg.ready();tg.expand();tg.MainButton.onClick(send);$('done').style.display='none'}
else if(P.preview==='1'){$('done').style.display='block';tg={sendData:function(d){$('area').textContent=d}};$('done').onclick=send}
else{$('wrap').style.display='none';$('msg').style.display='block';$('msg').textContent=T.out}
refresh();setTimeout(function(){map.invalidateSize()},300);
})();
</script>
</body>
</html>
